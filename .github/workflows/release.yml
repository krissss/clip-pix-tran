name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to package, for example v0.2.0'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  SIGNED_DERIVED_DATA: .build/xcode-signed

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  release:
    needs: test
    runs-on: macos-26
    environment: Prod
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Cache Xcode dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: xcode-${{ runner.os }}-${{ hashFiles('ClipPixTran.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            xcode-${{ runner.os }}-

      - name: Validate release secrets
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          test -n "$SIGNING_CERTIFICATE_P12"
          test -n "$SIGNING_CERTIFICATE_PASSWORD"
          test -n "$SIGNING_IDENTITY"
          test -n "$DEVELOPMENT_TEAM"

      - name: Validate signing certificate
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/signing_certificate.p12"
          CERT_PEM="$RUNNER_TEMP/signing_certificate.pem"
          KEY_PEM="$RUNNER_TEMP/signing_private_key.pem"
          trap 'rm -f "$CERT_PATH" "$CERT_PEM" "$KEY_PEM"' EXIT

          if ! python3 - <<'PY' > "$CERT_PATH"; then
          import base64
          import binascii
          import os
          import sys

          try:
              encoded = "".join(os.environ["SIGNING_CERTIFICATE_P12"].split())
              sys.stdout.buffer.write(base64.b64decode(encoded, validate=True))
          except binascii.Error as error:
              print(f"invalid base64: {error}", file=sys.stderr)
              raise SystemExit(1)
          PY
            echo "::error::SIGNING_CERTIFICATE_P12 is not valid base64."
            exit 1
          fi

          if [ ! -s "$CERT_PATH" ]; then
            echo "::error::SIGNING_CERTIFICATE_P12 decoded to an empty file."
            exit 1
          fi

          if ! openssl pkcs12 -in "$CERT_PATH" -passin pass:"$SIGNING_CERTIFICATE_PASSWORD" -nokeys -clcerts -out "$CERT_PEM" >/dev/null 2>&1; then
            echo "::error::SIGNING_CERTIFICATE_P12 is not a readable .p12 file, or SIGNING_CERTIFICATE_PASSWORD is incorrect."
            exit 1
          fi

          if ! openssl pkcs12 -in "$CERT_PATH" -passin pass:"$SIGNING_CERTIFICATE_PASSWORD" -nocerts -nodes -out "$KEY_PEM" >/dev/null 2>&1; then
            echo "::error::Could not read the private key from SIGNING_CERTIFICATE_P12."
            exit 1
          fi

          if ! grep -q 'BEGIN .*PRIVATE KEY' "$KEY_PEM"; then
            echo "::error::SIGNING_CERTIFICATE_P12 does not contain a private key. Export the Apple Development identity as a .p12 from Keychain Access, not just the certificate."
            exit 1
          fi

          openssl x509 -in "$CERT_PEM" -noout -subject

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v7.0.0
        with:
          p12-file-base64: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}

      - name: Write signing config
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          cat > Config/Signing.local.xcconfig << EOF
          DEVELOPMENT_TEAM = ${DEVELOPMENT_TEAM}
          EOF

      - name: Package app
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          make package-signed \
            TAG="${RELEASE_TAG}" \
            SIGNED_DERIVED_DATA="${SIGNED_DERIVED_DATA}" \
            SIGNED_CODE_SIGN_IDENTITY="${SIGNING_IDENTITY}" \
            SIGNED_DEVELOPMENT_TEAM="${DEVELOPMENT_TEAM}"

      - name: Sign update with Sparkle
        id: sparkle_sign
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          SIGN_UPDATE=$(make print-sparkle-sign-update DERIVED_DATA="${SIGNED_DERIVED_DATA}")
          SIGNATURE=$(printf '%s' "$SPARKLE_PRIVATE_KEY" | "$SIGN_UPDATE" "ClipPixTran-${RELEASE_TAG}.zip" --ed-key-file - 2>&1)
          ED_SIG=$(printf '%s\n' "$SIGNATURE" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          test -n "$ED_SIG"
          echo "ed_signature=$ED_SIG" >> "$GITHUB_OUTPUT"

          SIZE=$(stat -f%z "ClipPixTran-${RELEASE_TAG}.zip")
          echo "length=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Fetch release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${RELEASE_TAG}" --json body -q .body > /tmp/release_notes.md; then
            gh release create "${RELEASE_TAG}" --title "${RELEASE_TAG}" --generate-notes
            gh release view "${RELEASE_TAG}" --json body -q .body > /tmp/release_notes.md
          fi

      - name: Generate appcast item
        env:
          TAG: ${{ env.RELEASE_TAG }}
          ED_SIG: ${{ steps.sparkle_sign.outputs.ed_signature }}
          LENGTH: ${{ steps.sparkle_sign.outputs.length }}
        run: |
          export DATE="$(date -R)"
          export VERSION="${TAG#v}"
          export BUILD_NUMBER="$(git rev-list --count "${TAG}")"

          python3 <<'PY'
          import html
          import os
          import re

          tag = os.environ["TAG"]
          version = os.environ["VERSION"]
          build_number = os.environ["BUILD_NUMBER"]
          date = os.environ["DATE"]
          ed_sig = os.environ["ED_SIG"]
          length = os.environ["LENGTH"]

          with open('/tmp/release_notes.md') as f:
              notes = f.read().strip()

          html_parts = []
          in_list = False
          for line in notes.split('\n'):
              stripped = line.strip()
              if not stripped:
                  if in_list:
                      html_parts.append('</ul>')
                      in_list = False
                  continue
              m = re.match(r'^#{1,3}\s+(.*)', stripped)
              if m:
                  if in_list:
                      html_parts.append('</ul>')
                      in_list = False
                  html_parts.append(f'<b>{html.escape(m.group(1))}</b>')
              elif re.match(r'^[-*]\s+', stripped):
                  if not in_list:
                      html_parts.append('<ul>')
                      in_list = True
                  text = re.sub(r'^[-*]\s+', '', stripped)
                  html_parts.append(f'<li>{html.escape(text)}</li>')
              elif stripped.startswith('```'):
                  continue
              else:
                  if in_list:
                      html_parts.append('</ul>')
                      in_list = False
                  html_parts.append(html.escape(stripped))
          if in_list:
              html_parts.append('</ul>')

          notes_html = '\n'.join(html_parts).replace(']]>', ']]]]><![CDATA[>')
          item = '\n'.join([
              '        <item>',
              f'            <title>ClipPixTran {version}</title>',
              f'            <sparkle:version>{build_number}</sparkle:version>',
              f'            <sparkle:shortVersionString>{version}</sparkle:shortVersionString>',
              '            <sparkle:minimumSystemVersion>26.0</sparkle:minimumSystemVersion>',
              '            <sparkle:fullReleaseNotesLink>https://krissss.github.io/clip-pix-tran/CHANGELOG.md</sparkle:fullReleaseNotesLink>',
              f'            <pubDate>{date}</pubDate>',
              f'            <description><![CDATA[{notes_html}]]></description>',
              '            <enclosure',
              f'                url="https://github.com/krissss/clip-pix-tran/releases/download/{tag}/ClipPixTran-{tag}.zip"',
              f'                sparkle:edSignature="{ed_sig}"',
              f'                length="{length}"',
              '                type="application/octet-stream"',
              '            />',
              '        </item>',
          ])

          with open('/tmp/appcast_item.xml', 'w') as f:
              f.write(item + '\n')
          PY

      - name: Commit updated appcast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp CHANGELOG.md /tmp/CHANGELOG.md
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p docs
          cp /tmp/CHANGELOG.md docs/CHANGELOG.md

          if [ ! -f docs/appcast.xml ]; then
            cat > docs/appcast.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
              <channel>
                  <title>ClipPixTran Update Feed</title>
                  <link>https://krissss.github.io/clip-pix-tran/appcast.xml</link>
                  <description>ClipPixTran 版本更新</description>
                  <language>zh-CN</language>
              </channel>
          </rss>
          XML
          fi

          python3 <<'PY'
          import re

          with open('/tmp/appcast_item.xml') as f:
              item = f.read().rstrip()

          with open('docs/appcast.xml') as f:
              content = f.read()

          url_match = re.search(r'url="([^"]+)"', item)
          if url_match is None:
              raise SystemExit('appcast item is missing enclosure URL')

          content = re.sub(r'\s*<item>.*?</item>', '', content, flags=re.DOTALL)
          content = re.sub(r'\s*</channel>', '\n' + item + '\n    </channel>', content, count=1)

          with open('docs/appcast.xml', 'w') as f:
              f.write(content)
          PY

          git add docs/appcast.xml docs/CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore: update appcast.xml for ${RELEASE_TAG}"
          git push origin main

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ClipPixTran-${{ env.RELEASE_TAG }}.zip
            ClipPixTran-${{ env.RELEASE_TAG }}.dmg

      - name: Update Homebrew Tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ env.RELEASE_TAG }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set; skipping Homebrew tap update."
            exit 0
          fi

          SHA256=$(shasum -a 256 "ClipPixTran-${VERSION}.dmg" | cut -d ' ' -f 1)

          VER="${VERSION#v}"
          cat > clip-pix-tran.rb <<'CASK'
          cask "clip-pix-tran" do
            version "_VER_"
            sha256 "_SHA_"

            url "https://github.com/krissss/clip-pix-tran/releases/download/_TAG_/ClipPixTran-_TAG_.dmg"
            name "ClipPixTran"
            desc "macOS clipboard, screenshot, and translation utility"
            homepage "https://github.com/krissss/clip-pix-tran"

            depends_on macos: ">= :tahoe"

            app "ClipPixTran.app"

            zap delete: [
              "~/Library/Application Support/ClipPixTran",
              "~/Library/Caches/com.kriss.ClipPixTran",
              "~/Library/Preferences/com.kriss.ClipPixTran.plist",
            ]
          end
          CASK

          sed -i '' "s/_VER_/${VER}/g; s/_SHA_/${SHA256}/g; s/_TAG_/${VERSION}/g" clip-pix-tran.rb
          ENCODED=$(base64 < clip-pix-tran.rb | tr -d '\n')
          FILE_SHA=$(curl -sf -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/krissss/homebrew-tap/contents/Casks/clip-pix-tran.rb" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || echo "")

          BODY="{\"message\":\"Update clip-pix-tran to ${VER}\",\"content\":\"${ENCODED}\"}"
          if [ -n "$FILE_SHA" ]; then
            BODY="{\"message\":\"Update clip-pix-tran to ${VER}\",\"content\":\"${ENCODED}\",\"sha\":\"${FILE_SHA}\"}"
          fi

          curl -sf -X PUT \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/krissss/homebrew-tap/contents/Casks/clip-pix-tran.rb" \
            -d "$BODY"
